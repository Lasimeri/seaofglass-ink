<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seal — sea of glass</title>
  <meta name="theme-color" content="#0a0a0f">
  <style>
    :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #c4945a; --text-dim: #a07a48; --accent: #c4945a; --mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1rem; font-weight: 400; margin-bottom: 0.25rem; }
    h1 a { color: var(--text-dim); text-decoration: none; }
    h1 a:hover { color: var(--text); }
    .subtitle { font-size: 0.65rem; color: var(--text-dim); opacity: 0.6; margin-bottom: 1.5rem; }
    .section { margin-bottom: 2rem; }
    .section-title { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
    input, textarea, select { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.5rem; font: inherit; font-size: 0.75rem; outline: none; margin-bottom: 0.5rem; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { height: 15vh; resize: vertical; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .row input { margin-bottom: 0; }
    button { background: none; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.8rem; font: inherit; font-size: 0.7rem; cursor: pointer; }
    button:hover { border-color: var(--text); }
    .status { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.5rem; }
    .result { background: var(--surface); border: 1px solid var(--border); padding: 0.8rem; font-size: 0.75rem; margin-top: 0.75rem; word-break: break-all; }
    .result a { color: var(--accent); }
    .lock-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .countdown { font-size: 2rem; letter-spacing: 0.1em; margin: 1rem 0; }
    .hidden { display: none; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1><a href="/">ink</a> / seal</h1>
    <p class="subtitle">time-locked messages — unreadable until the unlock time</p>

    <div class="section" id="create-section">
      <div class="section-title">create a sealed message</div>
      <input type="text" id="title" placeholder="title (optional)">
      <textarea id="content" placeholder="message to seal..." spellcheck="false"></textarea>
      <div class="row">
        <input type="datetime-local" id="unlock-time">
        <button onclick="seal()">seal</button>
      </div>
      <div class="status" id="create-status"></div>
      <div class="result hidden" id="create-result"></div>
    </div>

    <hr>

    <div class="section" id="read-section">
      <div class="section-title">open a sealed message</div>
      <div class="row">
        <input type="text" id="seal-id" placeholder="seal ID">
        <button onclick="check()">check</button>
      </div>
      <div class="status" id="read-status"></div>
      <div id="read-result" class="hidden">
        <div id="lock-state"></div>
      </div>
    </div>
  </div>
  <script>
    const WORKER = 'https://sea-ink.seaofglass.workers.dev';
    // Default unlock time to 1 hour from now
    const now = new Date(Date.now() + 3600000);
    document.getElementById('unlock-time').value = now.toISOString().slice(0, 16);

    async function seal() {
      const content = document.getElementById('content').value.trim();
      const title = document.getElementById('title').value.trim();
      const unlockStr = document.getElementById('unlock-time').value;
      if (!content) return;
      if (!unlockStr) { document.getElementById('create-status').textContent = 'set an unlock time'; return; }
      const unlock = Math.floor(new Date(unlockStr).getTime() / 1000);
      document.getElementById('create-status').textContent = 'sealing...';
      try {
        const r = await fetch(WORKER + '/s/seal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: content, unlock, ...(title ? { title } : {}) }),
        });
        const d = await r.json();
        if (d.error) { document.getElementById('create-status').textContent = d.error; return; }
        const el = document.getElementById('create-result');
        el.innerHTML = `sealed until ${new Date(d.unlock * 1000).toLocaleString()}<br><a href="${d.url}">${d.url}</a>`;
        el.classList.remove('hidden');
        document.getElementById('create-status').textContent = 'sealed';
        document.getElementById('content').value = '';
      } catch (e) {
        document.getElementById('create-status').textContent = 'error: ' + e.message;
      }
    }

    let countdownInterval;
    async function check() {
      const id = document.getElementById('seal-id').value.trim();
      if (!id) return;
      document.getElementById('read-status').textContent = 'checking...';
      try {
        const r = await fetch(WORKER + '/s/seal/' + id);
        const d = await r.json();
        if (d.error) { document.getElementById('read-status').textContent = d.error; return; }
        const el = document.getElementById('lock-state');
        document.getElementById('read-result').classList.remove('hidden');
        if (d.locked) {
          document.getElementById('read-status').textContent = 'locked';
          if (countdownInterval) clearInterval(countdownInterval);
          function updateCountdown() {
            const remaining = d.unlock - Math.floor(Date.now() / 1000);
            if (remaining <= 0) { clearInterval(countdownInterval); check(); return; }
            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = remaining % 60;
            el.innerHTML = `<div class="lock-icon">&#x1f512;</div>` +
              (d.title ? `<div style="margin-bottom:0.5rem">${d.title}</div>` : '') +
              `<div class="countdown">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>` +
              `<div style="font-size:0.6rem;color:var(--text-dim)">unlocks ${new Date(d.unlock*1000).toLocaleString()}</div>`;
          }
          updateCountdown();
          countdownInterval = setInterval(updateCountdown, 1000);
        } else {
          if (countdownInterval) clearInterval(countdownInterval);
          document.getElementById('read-status').textContent = 'unlocked';
          el.innerHTML = `<div class="lock-icon">&#x1f513;</div>` +
            (d.title ? `<div style="margin-bottom:0.5rem">${d.title}</div>` : '') +
            `<div class="result">${d.data.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>` +
            `<div style="font-size:0.6rem;color:var(--text-dim);margin-top:0.5rem">sealed ${new Date(d.sealed_at*1000).toLocaleString()} — unlocked ${new Date(d.unlocked_at*1000).toLocaleString()}</div>`;
        }
      } catch (e) {
        document.getElementById('read-status').textContent = 'error: ' + e.message;
      }
    }

    // Auto-check if ID in hash
    if (location.hash.slice(1)) {
      document.getElementById('seal-id').value = location.hash.slice(1);
      check();
    }
  </script>
</body>
</html>
