<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>canary — sea of glass</title>
  <meta name="theme-color" content="#0a0a0f">
  <style>
    :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #c4945a; --text-dim: #a07a48; --mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1rem; font-weight: 400; margin-bottom: 0.25rem; }
    h1 a { color: var(--text-dim); text-decoration: none; }
    h1 a:hover { color: var(--text); }
    .subtitle { font-size: 0.65rem; color: var(--text-dim); opacity: 0.6; margin-bottom: 2rem; }
    .canary { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1rem; }
    .canary-message { font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 1rem; }
    .canary-date { font-size: 0.6rem; color: var(--text-dim); opacity: 0.6; }
    .no-canary { font-size: 0.8rem; color: var(--text-dim); padding: 2rem; text-align: center; }
    .status { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1><a href="/">ink</a> / canary</h1>
    <p class="subtitle">warrant canary — if this message disappears, something has changed</p>
    <div id="content">
      <div class="no-canary">loading...</div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const WORKER = 'https://sea-ink.seaofglass.workers.dev';
    async function load() {
      try {
        const r = await fetch(WORKER + '/s/canary');
        if (r.status === 404) {
          document.getElementById('content').innerHTML = '<div class="no-canary">no canary has been set</div>';
          return;
        }
        const d = await r.json();
        const date = new Date(d.updated).toLocaleString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
        });
        document.getElementById('content').innerHTML = `
          <div class="canary">
            <div class="canary-message">${d.message.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
            <div class="canary-date">last updated: ${date}</div>
          </div>`;
        document.getElementById('status').textContent = 'canary is alive';
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="no-canary">failed to fetch canary</div>';
        document.getElementById('status').textContent = e.message;
      }
    }
    load();
  </script>
</body>
</html>
