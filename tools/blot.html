<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ink blot — sea of glass</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" href="../data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1L15 8L8 15L1 8Z' fill='%23c4945a'/%3E%3C/svg%3E">
  <style>
    :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #c4945a; --text-dim: #a07a48; --mono: 'SF Mono','Cascadia Code','Fira Code','Consolas',monospace; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1rem; font-weight: 400; margin-bottom: 0.25rem; }
    h1 a { color: var(--text-dim); text-decoration: none; }
    h1 a:hover { color: var(--text); }
    .subtitle { font-size: 0.65rem; color: var(--text-dim); opacity: 0.6; margin-bottom: 1.5rem; }
    pre { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; font-size: 1rem; line-height: 1.2; text-align: center; margin-bottom: 1rem; white-space: pre; overflow-x: auto; }
    .hash { font-size: 0.6rem; color: var(--text-dim); opacity: 0.5; word-break: break-all; margin-bottom: 1rem; }
    button { background: none; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.8rem; font: inherit; font-size: 0.7rem; cursor: pointer; }
    button:hover { border-color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <h1><a href="/">ink</a> / blot</h1>
    <p class="subtitle">rorschach inkblot from SHA-256 — refresh for a new one</p>
    <pre id="blot">loading...</pre>
    <div class="hash" id="hash"></div>
    <button onclick="load()">regenerate</button>
  </div>
  <script>
    async function load() {
      const r = await fetch('/s/blot');
      const t = await r.text();
      const lines = t.split('\n');
      const hash = lines[lines.length - 1];
      const art = lines.slice(0, -2).join('\n');
      document.getElementById('blot').textContent = art;
      document.getElementById('hash').textContent = hash;
    }
    load();
  </script>
</body>
</html>
